name: Build Recora (Windows installer)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get ffmpeg (bundled next to Recora.exe as a sidecar)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item $exe.FullName "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Build whisper.cpp (offline speech-to-text for captions)
        continue-on-error: true
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp whisper_src
          cmake -S whisper_src -B whisper_build -A x64 -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          cmake --build whisper_build --config Release --target whisper-cli -j 4
          New-Item -ItemType Directory -Force src-tauri/whisper | Out-Null
          $cli = Get-ChildItem -Recurse whisper_build -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) { throw "whisper-cli.exe was not built" }
          Copy-Item $cli.FullName src-tauri/whisper/whisper-cli.exe
          Get-ChildItem $cli.Directory.FullName -Filter *.dll | ForEach-Object { Copy-Item $_.FullName src-tauri/whisper/ }
          Get-ChildItem src-tauri/whisper

      - run: npm install
      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Recora-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
