name: Build Recora (Windows installer)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get ffmpeg (bundled next to Recora.exe as a sidecar)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 3 -and -not $ok; $i++) {
              try {
                Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -TimeoutSec 300
                Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
                $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
                Copy-Item $exe.FullName "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
                $ok = $true
              } catch { Write-Host "retry $i for $u : $_"; Start-Sleep -Seconds 5 }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "ffmpeg download failed" }

      - run: npm install
      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Recora-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
